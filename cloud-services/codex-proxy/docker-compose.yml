services:
  codex-autoclaw-proxy:
    container_name: codex-autoclaw-proxy
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      LOCAL_PORT: ${LOCAL_PORT:-18801}
      BIND_HOST: 0.0.0.0
      BASE_URL: ${BASE_URL}
      API_KEY: ${API_KEY}
      CODEX_API_BASE: ${CODEX_API_BASE}
      CODEX_API_KEY: ${CODEX_API_KEY}
      OPENAI_BASE_URL: ${CODEX_API_BASE}
      OPENAI_API_KEY: ${CODEX_API_KEY}
      MODELS: ${MODELS:-gpt-5-codex,gpt-5,gpt-5.4,gpt-5.1,gpt-5.2}
    ports:
      - "${LOCAL_PORT:-18801}:${LOCAL_PORT:-18801}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${LOCAL_PORT:-18801}/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
